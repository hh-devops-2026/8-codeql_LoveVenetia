name: CodeQL + Docker CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  analyze:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [ go ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: autobuild

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  docker:
    name: Docker Build & Run
    runs-on: ubuntu-latest
    needs: analyze

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t go-web-server .

      - name: Run container
        run: docker run -d --name web -p 8080:8080 go-web-server

      - name: Wait for server to start
        run: |
          for i in $(seq 1 30); do
            if curl -sf "http://localhost:8080/readfile?file=safe-files/hello.txt" > /dev/null; then
              echo "Server is up"
              exit 0
            fi
            echo "Waiting for server... ($i/30)"
            sleep 2
          done
          echo "Server did not start in time"
          docker logs web
          exit 1

      - name: Verify response
        run: |
          RESPONSE=$(curl -s "http://localhost:8080/readfile?file=safe-files/hello.txt")
          echo "Response: $RESPONSE"
          if [ "$RESPONSE" != "Hello World" ]; then
            echo "Unexpected response"
            exit 1
          fi

      - name: Show container logs
        if: failure()
        run: docker logs web

      - name: Stop container
        if: always()
        run: docker rm -f web
